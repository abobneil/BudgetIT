name: Release (Windows + Linux)

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (example: v0.1.0)"
        required: true
        type: string
      draft:
        description: "Publish release as draft"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'workflow_run' && 'main-latest' || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    name: Resolve Release Metadata
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      target_commitish: ${{ steps.meta.outputs.target_commitish }}
      build_version: ${{ steps.meta.outputs.build_version }}
    steps:
      - name: Checkout (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout (default)
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          base_version="$(node -p "require('./package.json').version")"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ github.event.inputs.tag }}"
            build_version="${release_tag#v}"
            checkout_ref="$release_tag"
            release_name="BudgetIT $release_tag"
            prerelease="false"
            target_commitish=""
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            build_version="${release_tag#v}"
            checkout_ref="$release_tag"
            release_name="BudgetIT $release_tag"
            prerelease="false"
            target_commitish=""
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            full_sha="${{ github.event.workflow_run.head_sha }}"
            short_sha="${full_sha::7}"
            release_tag="main-latest"
            build_version="${base_version}-main.${{ github.event.workflow_run.run_number }}.${short_sha}"
            checkout_ref="${full_sha}"
            release_name="BudgetIT main latest (v${build_version})"
            prerelease="false"
            target_commitish="${full_sha}"
          else
            short_sha="${GITHUB_SHA::7}"
            release_tag="main-latest"
            build_version="${base_version}-main.${GITHUB_RUN_NUMBER}.${short_sha}"
            checkout_ref="${GITHUB_SHA}"
            release_name="BudgetIT main latest (v${build_version})"
            prerelease="false"
            target_commitish="${GITHUB_SHA}"
          fi

          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "target_commitish=${target_commitish}" >> "$GITHUB_OUTPUT"
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"

      - name: Validate tag exists (tagged/manual releases)
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --tags --force
            git rev-parse "${{ steps.meta.outputs.tag }}" >/dev/null
          fi

      - name: Ensure pushed tag commit is on main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin main
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"; then
            echo "Tag commit is not contained in origin/main." >&2
            exit 1
          fi

  quality:
    name: Lint, Typecheck, Test, Build, Help Check
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const buildVersion='${{ needs.preflight.outputs.build_version }}'; if(!buildVersion||!buildVersion.trim()){throw new Error('Resolved build version is empty.');} const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=buildVersion; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n', 'utf8'); console.log('Set package.json version to', buildVersion);"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Help Integrity Check
        run: npm run check:help-integrity

  package-windows:
    name: Build Windows Installers
    needs:
      - preflight
      - quality
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const buildVersion='${{ needs.preflight.outputs.build_version }}'; if(!buildVersion||!buildVersion.trim()){throw new Error('Resolved build version is empty.');} const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=buildVersion; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n', 'utf8'); console.log('Set package.json version to', buildVersion);"

      - name: Build release artifacts
        run: npm run release:win

      - name: Run packaged smoke checks
        run: npm run smoke:packaged:win

      - name: Validate artifacts
        shell: powershell
        run: |
          $packageJson = Get-Content -Raw package.json | ConvertFrom-Json
          $version = [string]$packageJson.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json version is missing or invalid."
          }

          $requiredArtifacts = @(
            "dist/release/BudgetIT-Setup-$version-x64.exe",
            "dist/release/BudgetIT-Setup-$version-arm64.exe"
          )

          foreach ($artifactPath in $requiredArtifacts) {
            if (-not (Test-Path $artifactPath)) {
              throw "Expected release artifact missing: $artifactPath"
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ needs.preflight.outputs.tag }}
          path: dist/release/*
          if-no-files-found: error

  package-linux-x64:
    name: Build Linux Artifacts (x64)
    needs:
      - preflight
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const buildVersion='${{ needs.preflight.outputs.build_version }}'; if(!buildVersion||!buildVersion.trim()){throw new Error('Resolved build version is empty.');} const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=buildVersion; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n', 'utf8'); console.log('Set package.json version to', buildVersion);"

      - name: Build release artifacts
        run: npm run release:linux -- --arch=x64

      - name: Run packaged smoke checks
        run: npm run smoke:packaged:linux -- --arch=x64

      - name: Validate artifacts
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ -z "${version}" ]]; then
            echo "package.json version is missing or invalid." >&2
            exit 1
          fi

          required_artifacts=(
            "dist/release/BudgetIT-${version}-linux-x64.AppImage"
            "dist/release/BudgetIT-${version}-linux-x64.deb"
          )

          for artifact in "${required_artifacts[@]}"; do
            if [[ ! -f "${artifact}" ]]; then
              echo "Expected release artifact missing: ${artifact}" >&2
              exit 1
            fi
          done

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release-${{ needs.preflight.outputs.tag }}
          path: dist/release/*
          if-no-files-found: error

  package-linux-arm64:
    name: Build Linux Artifacts (arm64)
    needs:
      - preflight
      - quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        shell: bash
        run: |
          node -e "const fs=require('fs'); const buildVersion='${{ needs.preflight.outputs.build_version }}'; if(!buildVersion||!buildVersion.trim()){throw new Error('Resolved build version is empty.');} const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=buildVersion; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n', 'utf8'); console.log('Set package.json version to', buildVersion);"

      - name: Build release artifacts
        run: npm run release:linux -- --arch=arm64

      - name: Run packaged smoke checks
        run: npm run smoke:packaged:linux -- --arch=arm64

      - name: Validate artifacts
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ -z "${version}" ]]; then
            echo "package.json version is missing or invalid." >&2
            exit 1
          fi

          required_artifacts=(
            "dist/release/BudgetIT-${version}-linux-arm64.AppImage"
            "dist/release/BudgetIT-${version}-linux-arm64.deb"
          )

          for artifact in "${required_artifacts[@]}"; do
            if [[ ! -f "${artifact}" ]]; then
              echo "Expected release artifact missing: ${artifact}" >&2
              exit 1
            fi
          done

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-release-${{ needs.preflight.outputs.tag }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - preflight
      - package-windows
      - package-linux-x64
      - package-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ needs.preflight.outputs.tag }}
          path: dist/release

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-release-${{ needs.preflight.outputs.tag }}
          path: dist/release

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-release-${{ needs.preflight.outputs.tag }}
          path: dist/release

      - name: Normalize published asset filenames
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          pick_one() {
            local pattern="$1"
            local destination="$2"
            local matches=($pattern)

            if (( ${#matches[@]} != 1 )); then
              echo "Expected exactly one match for ${pattern}, found ${#matches[@]}." >&2
              if (( ${#matches[@]} > 0 )); then
                printf '%s\n' "${matches[@]}" >&2
              fi
              exit 1
            fi

            mv "${matches[0]}" "dist/release/${destination}"
          }

          pick_one "dist/release/BudgetIT-Setup-*-x64.exe" "BudgetIT-windows-x64-latest.exe"
          pick_one "dist/release/BudgetIT-Setup-*-arm64.exe" "BudgetIT-windows-arm64-latest.exe"
          pick_one "dist/release/BudgetIT-*-linux-x64.AppImage" "BudgetIT-linux-x64-latest.AppImage"
          pick_one "dist/release/BudgetIT-*-linux-x64.deb" "BudgetIT-linux-x64-latest.deb"
          pick_one "dist/release/BudgetIT-*-linux-arm64.AppImage" "BudgetIT-linux-arm64-latest.AppImage"
          pick_one "dist/release/BudgetIT-*-linux-arm64.deb" "BudgetIT-linux-arm64-latest.deb"

          # Keep only canonical downloadable assets before checksums/publish.
          find dist/release -maxdepth 1 -type f ! -name 'BudgetIT-*-latest.*' -delete

      - name: Validate artifacts and create checksum
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/release/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts found in dist/release." >&2
            exit 1
          fi

          checksum_path="dist/release/SHA256SUMS.txt"
          : > "${checksum_path}"

          while IFS= read -r artifact_name; do
            hash="$(sha256sum "dist/release/${artifact_name}" | awk '{print $1}')"
            echo "${hash}  ${artifact_name}" >> "${checksum_path}"
          done < <(find dist/release -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -printf "%f\n" | sort)

      - name: Remove existing release assets for tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${{ needs.preflight.outputs.tag }}"
          release_id="$(gh api "repos/${{ github.repository }}/releases/tags/${tag_name}" --jq ".id" 2>/dev/null || true)"

          if [[ -z "${release_id}" ]]; then
            echo "No existing release found for tag ${tag_name}; skipping cleanup."
            exit 0
          fi

          asset_ids="$(gh api "repos/${{ github.repository }}/releases/${release_id}/assets" --jq ".[].id")"
          if [[ -z "${asset_ids}" ]]; then
            echo "No existing assets found for tag ${tag_name}."
            exit 0
          fi

          while IFS= read -r asset_id; do
            if [[ -n "${asset_id}" ]]; then
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/${asset_id}" >/dev/null
            fi
          done <<< "${asset_ids}"

      - name: Publish release
        if: needs.preflight.outputs.prerelease == 'false' && needs.preflight.outputs.tag != 'main-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.release_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' }}
          generate_release_notes: true
          overwrite_files: true
          make_latest: true
          files: dist/release/*

      - name: Publish main-latest release
        if: needs.preflight.outputs.tag == 'main-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.target_commitish }}
          name: ${{ needs.preflight.outputs.release_name }}
          prerelease: false
          draft: false
          generate_release_notes: true
          overwrite_files: true
          make_latest: true
          files: dist/release/*
