name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  help-integrity:
    name: Help Integrity
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Help Integrity Check
        run: npm run help:check

  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Help Integrity Check
        run: npm run help:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  package-windows:
    name: Package Windows Installers (Smoke)
    needs:
      - help-integrity
      - quality
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS artifact
        run: npm run dist:win

      - name: Run packaged smoke checks
        run: npm run smoke:packaged:win

      - name: Validate artifact exists
        shell: powershell
        run: |
          $packageJson = Get-Content -Raw package.json | ConvertFrom-Json
          $version = [string]$packageJson.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json version is missing or invalid."
          }

          $requiredArtifacts = @(
            "dist/release/BudgetIT-Setup-$version-x64.exe",
            "dist/release/BudgetIT-Setup-$version-arm64.exe"
          )

          foreach ($artifactPath in $requiredArtifacts) {
            if (-not (Test-Path $artifactPath)) {
              throw "Expected NSIS executable was not produced: $artifactPath"
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-release-${{ github.run_id }}
          path: dist/release/**
          if-no-files-found: error

  package-linux-x64:
    name: Package Linux Artifacts (x64 Smoke)
    needs:
      - help-integrity
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Linux x64 artifacts
        run: npm run dist:linux -- --arch=x64

      - name: Run packaged smoke checks
        run: npm run smoke:packaged:linux -- --arch=x64

      - name: Validate Linux x64 artifacts exist
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ -z "${version}" ]]; then
            echo "package.json version is missing or invalid." >&2
            exit 1
          fi

          required_artifacts=(
            "dist/release/BudgetIT-${version}-linux-x64.AppImage"
            "dist/release/BudgetIT-${version}-linux-x64.deb"
          )

          for artifact in "${required_artifacts[@]}"; do
            if [[ ! -f "${artifact}" ]]; then
              echo "Expected Linux artifact was not produced: ${artifact}" >&2
              exit 1
            fi
          done

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-x64-release-${{ github.run_id }}
          path: dist/release/**
          if-no-files-found: error

  package-linux-arm64:
    name: Package Linux Artifacts (arm64 Smoke)
    needs:
      - help-integrity
      - quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Linux arm64 artifacts
        run: npm run dist:linux -- --arch=arm64

      - name: Run packaged smoke checks
        run: npm run smoke:packaged:linux -- --arch=arm64

      - name: Validate Linux arm64 artifacts exist
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ -z "${version}" ]]; then
            echo "package.json version is missing or invalid." >&2
            exit 1
          fi

          required_artifacts=(
            "dist/release/BudgetIT-${version}-linux-arm64.AppImage"
            "dist/release/BudgetIT-${version}-linux-arm64.deb"
          )

          for artifact in "${required_artifacts[@]}"; do
            if [[ ! -f "${artifact}" ]]; then
              echo "Expected Linux artifact was not produced: ${artifact}" >&2
              exit 1
            fi
          done

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-arm64-release-${{ github.run_id }}
          path: dist/release/**
          if-no-files-found: error

