name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  package-windows:
    name: Package Windows Installer (Smoke)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS artifact
        run: npm run dist:win

      - name: Run packaged smoke checks
        run: npm run smoke:packaged

      - name: Validate artifact exists
        shell: powershell
        run: |
          $packageJson = Get-Content -Raw package.json | ConvertFrom-Json
          $version = [string]$packageJson.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json version is missing or invalid."
          }

          $requiredArtifacts = @(
            "dist/release/BudgetIT-Setup-$version-x64.exe",
            "dist/release/BudgetIT-Setup-$version-arm64.exe"
          )

          foreach ($artifactPath in $requiredArtifacts) {
            if (-not (Test-Path $artifactPath)) {
              throw "Expected NSIS executable was not produced: $artifactPath"
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-installer-${{ github.run_id }}
          path: dist/release/**
          if-no-files-found: error

