appId: com.budgetit.desktop
productName: BudgetIT
artifactName: BudgetIT-${version}-win-${arch}.${ext}

directories:
  output: dist/release

npmRebuild: false

toolsets:
  winCodeSign: "1.1.0"

files:
  - apps/desktop/dist/**/*
  - apps/desktop/assets/**/*
  - apps/renderer/dist/**/*
  - docs/help-system.md
  - packages/core/dist/**/*
  - packages/db/dist/**/*
  - packages/db/package.json
  - package.json

extraResources:
  - from: apps/desktop/assets/app-icon.ico
    to: app-icon.ico

extraMetadata:
  main: apps/desktop/dist/main.js

win:
  icon: apps/desktop/assets/app-icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64

nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: apps/desktop/assets/app-icon.ico
  uninstallerIcon: apps/desktop/assets/app-icon.ico
  installerHeaderIcon: apps/desktop/assets/app-icon.ico
  artifactName: BudgetIT-Setup-${version}-${arch}.${ext}
  createDesktopShortcut: always
  runAfterFinish: true

